name: fwupd Test

# START OF COMMON SECTION
on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# END OF COMMON SECTION

jobs:
  build_gnutls:
    name: Build wolfSSL, GnuTLS and provider
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        fwupd_ref: [ 'main', '1.9.26', '2.0.12' ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    container:
      image: debian:bookworm

    steps:
      - name: Checkout gnutls-wolfssl repository
        uses: actions/checkout@v4

      - name: Ensure make available (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt-get update
          apt-get install -y build-essential sudo wget git

      - name: Install GnuTLS dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y gnulib autopoint gperf gtk-doc-tools nettle-dev clang \
            libtasn1-bin libtasn1-6-dev libunistring-dev libp11-kit-dev libunbound-dev

      - name: Install fwupd dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt install -y \
            meson ninja-build git libgusb-dev libglib2.0-dev libxmlb-dev \
            libsoup2.4-dev libarchive-dev libjson-glib-dev libpolkit-gobject-1-dev \
            libsystemd-dev valgrind gobject-introspection libgirepository1.0-dev gtk-doc-tools python3-pip \
            libgpgme-dev valac libcurl4-gnutls-dev libpango-1.0-0 libpangocairo-1.0-0 \
            libpango1.0-dev libcairo2 libcairo2-dev libcairo-gobject2 python3-cairo \
            python3-gi-cairo python3-gi gir1.2-pango-1.0 gir1.2-cairo-1.0 gir1.2-gtk-3.0 \
            gnu-efi flashrom libflashrom-dev mingw-w64-tools libumockdev-dev
          sudo apt-get install -y python3-pip
          sudo apt-get install -y policykit-1 libpolkit-agent-1-dev gettext itstool
          sudo apt-get install -y libzstd-dev zstd
          pip3 install --break-system-packages jinja2 packaging typogrify
          pip3 install --break-system-packages --upgrade meson

      - name: Install build and test dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y autoconf libtool valgrind

      # ───────────── cache the wolfssl/gnutls tool-chain ─────────────
      - name: Restore cached gnutls-wolfssl
        id: cache-gnutls
        uses: actions/cache@v4
        with:
          path: |
            /opt/gnutls
            /opt/wolfssl
            /opt/wolfssl-gnutls-wrapper
          key: gnutls-wolfssl-${{ runner.os }}-${{ hashFiles('setup.sh', 'wolfssl-gnutls-wrapper/**', 'wolfssl/**', 'gnutls/**') }}
          restore-keys: |
            gnutls-wolfssl-${{ runner.os }}-

      - name: Build GnuTLS with wolfSSL provider using setup.sh script
        if: steps.cache-gnutls.outputs.cache-hit != 'true'
        run: |
          echo "Running setup.sh..."
          GNUTLS_INSTALL=/opt/gnutls WOLFSSL_INSTALL=/opt/wolfssl ./setup.sh

      - name: Check setup.sh output directories
        run: |
          echo "Check for wolfSSL installation..."
          test -d /opt/wolfssl || exit 1
          echo "Check for GnuTLS installation..."
          test -d /opt/gnutls || exit 1
          echo "Check for wrapper installation..."
          test -d /opt/wolfssl-gnutls-wrapper/lib || exit 1

      - name: Build fwupd at ${{ matrix.fwupd_ref }}
        run: |
          git clone --depth=1 --branch ${{ matrix.fwupd_ref }} https://github.com/fwupd/fwupd.git

      - name: Patch fwupd tests for Debian Bookworm compatibility
        if: matrix.fwupd_ref != '1.9.26'
        working-directory: fwupd
        run: |
          # GLib in Debian Bookworm emits WARNING for invalid properties while
          # Ubuntu's GLib emits CRITICAL. Same behavior, different log level.
          # Adjust test expectations to match Debian's GLib.
          # This gets applied only for the latest version and the latest main branch,
          # target version remains untouched since it's using the correct older version
          # of glib that matches the one on debian:bookworm.
          if [ "${{ matrix.fwupd_ref }}" != "main" ]; then
            sed -i 's/GLib-GObject-CRITICAL/GLib-GObject-WARNING/g' libfwupd/fwupd-self-test.c
          else
            sed -i 's/GLib-GObject-CRITICAL/GLib-GObject-WARNING/g' libfwupd/fwupd-client-test.c
          fi

      - name: Patch fwupd 1.9.26 tests for Debian Bookworm's libxmlb
        if: matrix.fwupd_ref == '1.9.26'
        working-directory: fwupd
        run: |
          # Debian Bookworm updated libxmlb to 0.3.22 in a stable point release.
          # The newer libxmlb writes an empty XML element in the short
          # self-closing form ("<chunks />") instead of an open/close pair
          # ("<chunks>\n</chunks>"). Both mean the same thing, but fwupd 1.9.26's
          # fu_chunk_func test compares the exact text, so it aborts.
          # Formatting only, unrelated to the wolfSSL/GnuTLS provider.
          # Adjust the expected string to match the libxmlb shipped in the container.
          sed -i 's|<chunks>\\n</chunks>\\n|<chunks />\\n|g' libfwupdplugin/fu-self-test.c
          # Fail loudly if the pattern was not found (e.g. test source changed).
          grep -qF '"<chunks />\n"' libfwupdplugin/fu-self-test.c

      - name: Install Rust toolchain (main only)
        if: matrix.fwupd_ref == 'main'
        run: |
          # fwupd main now declares Rust as a required project language
          # (meson aborts with "Unknown compiler(s): [['rustc']]" otherwise)
          # and needs rustc >= 1.75. Debian Bookworm ships 1.63, so install a
          # minimal stable toolchain via rustup instead. The Rust code only
          # contains fwupd's own crates, no crypto, so this is unrelated to the
          # wolfSSL/GnuTLS provider.
          sudo apt-get install -y curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure fwupd
        working-directory: fwupd
        run: |
          export PKG_CONFIG_PATH=/opt/gnutls/lib/pkgconfig
          export PATH="$PATH:/opt/gnutls/bin"
          meson setup builddir

      - name: Make fwupd
        working-directory: fwupd
        run: |
          export PATH="$PATH:/opt/gnutls/bin"
          ninja -v -C builddir

      - name: Test fwupd
        working-directory: fwupd
        run: |
          export WGW_LOGGING=1
          meson test -C builddir --print-errorlogs

