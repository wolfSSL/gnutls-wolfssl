name: rsyslog Test

# START OF COMMON SECTION
on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# END OF COMMON SECTION

jobs:
  build_gnutls:
    name: Build wolfSSL, GnuTLS and provider
    timeout-minutes: 40
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        rsyslog_ref: [ 'main', 'v8.2302.0' ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    container:
      image: debian:bookworm

    steps:
      - name: Checkout gnutls-wolfssl repository
        uses: actions/checkout@v4

      - name: Ensure make available (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt-get update
          apt-get install -y build-essential sudo wget git

      - name: Install GnuTLS dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y gnulib autopoint gperf gtk-doc-tools nettle-dev clang libtasn1-bin libtasn1-6-dev libunistring-dev libp11-kit-dev libunbound-dev

      - name: Install rsyslog dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y build-essential pkg-config libestr-dev libfastjson-dev zlib1g-dev uuid-dev libhiredis-dev uuid-dev flex bison
          sudo apt-get install -y libdbi-dev libmariadb-dev-compat postgresql-client libpq-dev libnet-dev librdkafka-dev libpcre3-dev libtokyocabinet-dev libglib2.0-dev libmongo-client-dev libyaml-dev
          sudo apt-get install -y libcurl4-gnutls-dev
          sudo apt-get install -y protobuf-c-compiler libprotobuf-c-dev libsnappy-dev
          apt-get install -y python3-pip
          pip3 install --break-system-packages docutils

      - name: Install build and test dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y autoconf autoconf-archive libtool valgrind

      # Restore (and later save) the compiled tool-chain if it already exists
      - name: Restore cached gnutls-wolfssl
        id: cache-gnutls
        uses: actions/cache@v4
        with:
          path: |
            /opt/gnutls
            /opt/wolfssl
            /opt/wolfssl-gnutls-wrapper
          key: gnutls-wolfssl-${{ runner.os }}-${{ hashFiles('setup.sh', 'wolfssl-gnutls-wrapper/**', 'wolfssl/**', 'gnutls/**') }}
          restore-keys: |
            gnutls-wolfssl-${{ runner.os }}-

      - name: Build GnuTLS with wolfSSL provider using setup.sh script
        if: steps.cache-gnutls.outputs.cache-hit != 'true'
        run: |
          echo "Running setup.sh..."
          GNUTLS_INSTALL=/opt/gnutls WOLFSSL_INSTALL=/opt/wolfssl ./setup.sh

      - name: Check setup.sh output directories
        run: |
          echo "Check for wolfSSL installation..."
          if [ ! -d /opt/wolfssl ]; then
            echo "/opt/wolfssl not found after setup"
            exit 1
          fi
          echo "Check for GnuTLS installation..."
          if [ ! -d /opt/gnutls ]; then
            echo "/opt/gnutls not found after setup"
            exit 1
          fi
          echo "Check for wrapper installation..."
          if [ ! -d /opt/wolfssl-gnutls-wrapper/lib ]; then
            echo "/opt/wolfssl-gnutls-wrapper/lib not found after setup"
            exit 1
          fi

      - name: Build rsyslog at ${{ matrix.rsyslog_ref }}
        uses: actions/checkout@v4
        with:
          repository: rsyslog/rsyslog
          ref: ${{ matrix.rsyslog_ref }}
          path: rsyslog

      - name: Configure rsyslog
        working-directory: rsyslog
        run: |
          # adding --without-valgrind-testbench basically drops the entire *-vg.sh
          # subset from the make check run.
          # with valgrind, in this container, rsyslogd starts slowly
          # and the testbench returns (sometimes, but often enough)
          # false negatives ("pid no longer active during startup"),
          # aborting the test test before it exercises
          # anything (valgrind itself reports 0 errors).
          # unrelated to the provider, and the provider already has valgrind
          # coverage in unit-tests.yml.
          ./autogen.sh --enable-gnutls --disable-libgcrypt --enable-testbench --enable-imdiag --enable-omstdout --without-valgrind-testbench PKG_CONFIG_PATH=/opt/gnutls/lib/pkgconfig

      - name: Make rsyslog
        working-directory: rsyslog
        run: |
          make -j $(nproc)

      - name: Test rsyslog
        working-directory: rsyslog
        # Run the testbench for both the target version and main. The main
        # branch can be unstable (https://github.com/rsyslog/rsyslog/issues/5771),
        # so only tolerate failures there.
        continue-on-error: ${{ matrix.rsyslog_ref == 'main' }}
        run: |
          export LD_LIBRARY_PATH=/opt/gnutls/lib:/opt/wolfssl/lib:/opt/wolfssl-gnutls-wrapper/lib
          export WGW_LOGGING=1
          make check 2>&1 | tee test.log
          awk '/^FAIL:/ {gsub(/\.sh$/, ".log", $2); print "==== " $2 " ===="; system("cat tests/" $2 "\n")}' test.log
          echo "Check for failures"
          # Gate only on genuine test-result failures (FAIL: <name>.sh). The two
          # omfile-read-only[-errmsg].sh tests assume a non-root user.
          # They chmod 0400 an output file and expect the write to be denied so a
          # fallback action fires. rsyslogd runs as root in the debian:bookworm
          # container and bypasses the permission, so they fail for environmental
          # reasons unrelated to the wolfSSL/GnuTLS provider.
          # Any other functional or TLS failure still fails the job.
          EC=0
          if grep -E '^FAIL: [^ ]+\.sh' test.log | grep -vE 'omfile-read-only(-errmsg)?\.sh'; then
            EC=1
          fi
          exit $EC

